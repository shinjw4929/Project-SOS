// chat.proto — 채팅 서버 프로토콜 정의 (Single Source of Truth)
//
// 이 파일은 C++ 채팅 서버와 Unity 클라이언트 양쪽에서 공유한다.
// 최종적으로 Project-SOS-Protocol 저장소에 위치하며, 양쪽 프로젝트에서 git submodule로 참조.
//
// 코드젠:
//   C++:  protoc --cpp_out=src/protocol/generated proto/chat.proto
//   C#:   protoc --csharp_out=Assets/Scripts/Client/Network/Generated proto/chat.proto
//
// TCP 프레이밍:
//   [4 bytes: payload length (little-endian)] [N bytes: ChatEnvelope protobuf binary]
//   ChatEnvelope의 oneof로 메시지 타입을 구분하므로 별도 타입 바이트 불필요.
//
// queue.proto의 Envelope와 독립적인 ChatEnvelope를 사용한다.
// 이유: 서버 간 프로토콜 결합 방지. 큐 서버와 채팅 서버가 독립적으로 진화 가능.

syntax = "proto3";
package sos.chat;

// ============================================================
// 공통 타입
// ============================================================

enum ChatChannel {
    CHANNEL_UNKNOWN = 0;
    CHANNEL_LOBBY = 1;       // 로비 전체
    CHANNEL_TEAM = 2;        // 인게임 팀 (같은 session_id + 같은 team_id)
    CHANNEL_ALL = 3;         // 인게임 전체 (같은 session_id)
    CHANNEL_WHISPER = 4;     // 1:1 귓속말
}

// ============================================================
// 클라이언트 → 채팅 서버
// ============================================================

// 인증 요청
// 로비: player_id + player_name만 (session_id="", team_id=0)
// 인게임: 매칭 후 session_id + team_id 포함하여 재전송
message ChatAuth {
    string player_id = 1;
    string session_id = 2;
    uint32 team_id = 3;
    string player_name = 4;  // 채팅 표시명 (ChatReceive.sender_name에 사용)
}

// 메시지 전송
message ChatSend {
    ChatChannel channel = 1;
    string content = 2;          // 최대 200자 (UTF-8)
    string whisper_target = 3;   // CHANNEL_WHISPER일 때만 사용 (대상 player_id)
}

// 채널 참가 (수동)
message JoinChannel {
    ChatChannel channel = 1;
}

// 채널 퇴장 (수동)
message LeaveChannel {
    ChatChannel channel = 1;
}

// 연결 유지 확인 (클라이언트 → 서버, 주기적 전송)
message ChatHeartbeat {}

// ============================================================
// 채팅 서버 → 클라이언트
// ============================================================

// 인증 결과
message ChatAuthResult {
    bool success = 1;
    string reason = 2;
}

// 메시지 수신
message ChatReceive {
    ChatChannel channel = 1;
    string sender_id = 2;
    string sender_name = 3;     // ChatAuth.player_name 또는 SessionCreated.PlayerInfo.player_name
    uint32 sender_team_id = 4;
    string content = 5;
    uint64 timestamp = 6;       // Unix timestamp (seconds)
}

// 시스템 메시지 (참가/퇴장 알림 등)
message SystemMessage {
    ChatChannel channel = 1;
    string content = 2;
    uint64 timestamp = 3;
}

// 에러 응답
message ChatError {
    ChatErrorCode code = 1;
    string message = 2;

    enum ChatErrorCode {
        UNKNOWN = 0;
        NOT_AUTHENTICATED = 1;   // 인증 전 메시지 전송 시도
        RATE_LIMITED = 2;        // 5초당 10메시지 초과
        INVALID_CHANNEL = 3;    // 존재하지 않는 채널
        MESSAGE_TOO_LONG = 4;   // 200자 초과 또는 빈 메시지
        PLAYER_NOT_FOUND = 5;   // 귓속말 대상 미접속
        CHANNEL_NOT_JOINED = 6; // 참가하지 않은 채널로 전송 시도
    }
}

// ============================================================
// 내부 서버 간 (큐 서버 → 채팅 서버, TCP :8083)
// ============================================================

// 매칭 성립 → 세션 채널 생성 요청
message SessionCreated {
    string session_id = 1;
    repeated PlayerInfo players = 2;

    message PlayerInfo {
        string player_id = 1;
        uint32 team_id = 2;
        string player_name = 3;  // 표시명 전달
    }
}

// 게임 종료 → 세션 채널 삭제 요청
message SessionEnded {
    string session_id = 1;
}

// ============================================================
// 래퍼 메시지 (모든 TCP 통신에 사용)
// ============================================================

// 단일 ChatEnvelope로 모든 메시지 타입을 감싸서 전송.
// oneof로 타입 디스패치 — 별도 MessageType enum이나 타입 헤더 불필요.
// queue.proto의 Envelope와 독립적.
message ChatEnvelope {
    oneof payload {
        // 클라이언트 → 채팅 서버
        ChatAuth auth = 1;
        ChatSend send = 2;
        JoinChannel join_channel = 3;
        LeaveChannel leave_channel = 4;
        ChatHeartbeat heartbeat = 5;

        // 채팅 서버 → 클라이언트
        ChatAuthResult auth_result = 10;
        ChatReceive receive = 11;
        SystemMessage system_message = 12;
        ChatError error = 13;

        // 내부 서버 간 (큐 서버 → 채팅 서버)
        SessionCreated session_created = 20;
        SessionEnded session_ended = 21;
    }
}
